    <h1>Road to Riches: Indie Artist Simulator</h1>
    <p>What does it really cost to release music as an independent artist — and how many streams do you need just to break even?</p>
    <p>This game walks you through the real costs of recording, artwork, videos and promotion, then calculates how many streams you need to get your money back. Spoiler: it's not pretty.</p>
    <p>To play the game, please enable JavaScript in your browser.</p>
    <p>Tipino lets music fans add fair pay to their streaming by setting a monthly donation that goes directly to the artists they love. <a href="https://tipino.app/">Join the waitlist at tipino.app</a>.</p>
